name: Refresh public profile statistics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build_profile.py
      - .github/workflows/update-profile.yml
  schedule:
    - cron: '17 6 * * *'
permissions:
  contents: write
concurrency:
  group: profile-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Generate profile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_profile.py
      - name: Commit refreshed statistics
        run: |
          git add README.md assets/languages.svg
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs: refresh public profile statistics'
          git push
